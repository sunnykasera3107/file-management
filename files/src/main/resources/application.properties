spring.application.name=files

# Connection details
spring.mongodb.host=${MONGO_HOST}
spring.mongodb.port=27017
spring.mongodb.database=files_analysis

# Authentication credentials
spring.mongodb.username=${MONGO_ROOT_USERNAME}
spring.mongodb.password=${MONGO_ROOT_PASSWORD}
spring.mongodb.authentication-database=admin

# key
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

# Storage path
file.storage.path=/home/app/storage
file.read.bytesize=8192 


spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/spring_batch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Max file size for each individual file
spring.servlet.multipart.max-file-size=102400MB

# Max request size for the entire multipart request (files + form data)
spring.servlet.multipart.max-request-size=102400MB