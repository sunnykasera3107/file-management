spring.application.name=users

# spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/${MySQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=${MySQL_USERNAME}
# spring.datasource.password=${MySQL_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/user_manager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=who_will_manage
spring.datasource.password=whose_Secrets
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optional: Hibernate / JPA Optimization Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Jwt properties
jwt.issuer=user-service
jwt.expiration=86400