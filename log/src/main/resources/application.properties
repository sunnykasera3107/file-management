spring.application.name=log

# Connection details
spring.mongodb.host=${MONGO_HOST}
spring.mongodb.port=27017
spring.mongodb.database=files_analysis

# Authentication credentials
spring.mongodb.username=${MONGO_ROOT_USERNAME}
spring.mongodb.password=${MONGO_ROOT_PASSWORD}
spring.mongodb.authentication-database=admin




spring.kafka.bootstrap-servers=kafka:9092

# ===============================
# Consumer
# ===============================

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.JsonDeserializer


# ===============================
# Producer
# ===============================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.JsonSerializer


